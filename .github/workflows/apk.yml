name: APK derle

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Uygulamayı derle
        run: gradle assembleDebug --stacktrace

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk Yoldas.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Yoldas-apk
          path: Yoldas.apk

      - name: Son sürümü yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete son-surum -y --cleanup-tag || true
          gh release create son-surum Yoldas.apk \
            --title "Yoldaş · son sürüm" \
            --notes "Otomatik derlendi: ${GITHUB_SHA::7}. Telefonundan Yoldas.apk dosyasını indirip kur."
